<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Now Playing</h1>
    </header>
    <main>
        <section id="now-playing">
            <h2>Current Track</h2>
            <p id="track-info">Loading...</p>
        </section>
        <section id="controls">
            <button id="play-pause">Play/Pause</button>
            <button id="next-track">Next Track</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Music Player</p>
    </footer>
    <script src="scripts.js"></script>
</html>
